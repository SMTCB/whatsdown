name: Retry stalled tickets

# Vercel's free plan only allows a daily cron, so this runs the same endpoint every 10 minutes.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call the retry endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --silent --show-error --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/retry-stalled"
