# Copy this file into the TARGET repository as .github/workflows/whatsdown-checks.yml.
# WhatsDown pushes each proposed fix to a throwaway branch named whatsdown/*; this workflow
# runs the project's own checks there. Adjust the commands to the project.
# Needs the repository secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY (the public ones the app ships with).
name: WhatsDown checks
on:
  push:
    branches: ["whatsdown/**"]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      VITE_AUTH_ENABLED: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint --if-present
      - name: Build
        run: npm run build --if-present
      - name: Install browser
        run: npx playwright install-deps chromium && npx playwright install chromium
      # Same demo-mode browser tests as the main CI: desktop and phone, no database needed.
      - name: Browser tests (desktop and phone)
        env:
          CI: true
          SKIP_BUILD: true
        run: npx playwright test --project=desktop-chrome --project=mobile-chrome --reporter=list
